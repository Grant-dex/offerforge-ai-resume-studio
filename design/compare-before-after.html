<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>改版前后</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#EEEDEA;font-family:"PingFang SC","Helvetica Neue",Arial,sans-serif;color:#1A1A1A;padding:22px 26px 26px}
header{display:flex;align-items:baseline;gap:12px;margin-bottom:12px}
h1{font-size:18px}header p{font-size:11px;color:#8A8A86}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:#fff;border:1px solid #E0DFDB;padding:8px 8px 10px}
.shot{border:1px solid #ECEBE8;overflow:hidden}
.shot img{display:block;width:100%}
.meta{display:flex;align-items:baseline;justify-content:space-between;padding-top:8px}
.badge{font-size:9.5px;font-weight:700;letter-spacing:.12em;padding:2px 6px;color:#fff;background:#8A8A86}
.badge.new{background:#A8452B}
.name{font-size:12px;font-weight:700}.kind{font-size:10px;color:#8A8A86}
</style></head><body>
<header><h1>改版前后对比</h1><p>同一份内容 · 同一套暖纸衬线模板</p></header>
<div class="grid">
 <div class="card"><div class="shot"><img src="shell-shots/0-before.png"></div>
   <div class="meta"><span class="badge">BEFORE</span><span class="name">冷灰外壳 · 近黑按钮</span><span class="kind">纸面暖、外壳冷</span></div></div>
 <div class="card"><div class="shot"><img src="shell-shots/impl/1-editorial.png"></div>
   <div class="meta"><span class="badge new">AFTER</span><span class="name">暖纸外壳 · 陶土红</span><span class="kind">同色温、同强调色</span></div></div>
</div></body></html>
