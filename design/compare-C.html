<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>方案 C</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#EEEDEA;font-family:"PingFang SC","Helvetica Neue",Arial,sans-serif;color:#1A1A1A;padding:24px 28px 28px}
header{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
h1{font-size:19px}h1 b{color:#1E3A33}
header p{font-size:11.5px;color:#8A8A86}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{background:#fff;border:1px solid #E0DFDB;padding:7px 7px 9px}
.shot{border:1px solid #ECEBE8;overflow:hidden}
.shot img{display:block;width:100%}
.meta{display:flex;align-items:baseline;justify-content:space-between;padding-top:7px}
.name{font-size:12px;font-weight:700}.kind{font-size:10px;color:#8A8A86}
.desc{margin-top:3px;font-size:10px;line-height:1.5;color:#5F5F5C}
</style></head><body>
<header><h1>方案 C · 外壳统一，强调色跟随</h1><p>暖米底 #F3EEE5 + 宋体字标固定，只有强调色随模板变</p></header>
<div class="grid">
 <div class="card"><div class="shot"><img src="shell-shots/c/1-editorial.png"></div><div class="meta"><span class="name">暖纸衬线</span><span class="kind">陶土红 #A8452B</span></div><p class="desc">外壳与纸面同色温，强调色一致。</p></div>
 <div class="card"><div class="shot"><img src="shell-shots/c/2-swiss.png"></div><div class="meta"><span class="name">冷灰网格</span><span class="kind">靛蓝 #1F4FD8</span></div><p class="desc">外壳仍是暖纸风，靠靛蓝按钮呼应冷灰纸面。</p></div>
 <div class="card"><div class="shot"><img src="shell-shots/c/3-deep.png"></div><div class="meta"><span class="name">墨绿商务</span><span class="kind">墨绿 #1E3A33</span></div><p class="desc">同一套外壳，强调色换成墨绿。</p></div>
</div></body></html>
