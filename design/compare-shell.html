<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>网页外壳 · 风格适配效果图</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#EEEDEA;font-family:"PingFang SC","Helvetica Neue",Arial,sans-serif;color:#1A1A1A;padding:28px 32px 32px}
header{display:flex;align-items:baseline;gap:14px;margin-bottom:18px}
h1{font-size:20px;letter-spacing:.01em}
header p{font-size:12px;color:#8A8A86}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.card{background:#fff;border:1px solid #E0DFDB;padding:10px 10px 12px}
.shot{border:1px solid #ECEBE8;overflow:hidden;background:#fff}
.shot img{display:block;width:100%}
.meta{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding-top:9px}
.name{font-size:13px;font-weight:700}
.kind{font-size:10.5px;color:#8A8A86}
.desc{margin-top:4px;font-size:11px;line-height:1.6;color:#5F5F5C}
.before .name{color:#777}
</style></head><body>
<header><h1>网页外壳 × 三套模板</h1><p>只改配色 / 字体 / 强调色，布局、功能、文案一律不动</p></header>
<div class="grid">
  <div class="card before"><div class="shot"><img src="shell-shots/0-before.png"></div>
    <div class="meta"><span class="name">现状</span><span class="kind">石墨灰</span></div>
    <p class="desc">冷灰底色 + 近黑主按钮，纸面是暖的，外壳是冷的，两者各说各话。</p></div>
  <div class="card"><div class="shot"><img src="shell-shots/1-editorial.png"></div>
    <div class="meta"><span class="name">暖纸衬线</span><span class="kind">陶土红 #A8452B</span></div>
    <p class="desc">暖米底、衬线字标、陶土红主按钮与当前章节，纸面与外壳同一个色温。</p></div>
  <div class="card"><div class="shot"><img src="shell-shots/2-swiss.png"></div>
    <div class="meta"><span class="name">冷灰网格</span><span class="kind">靛蓝 #1F4FD8</span></div>
    <p class="desc">中性白底、无衬线字标、靛蓝只出现在主按钮与当前项，克制对齐。</p></div>
  <div class="card"><div class="shot"><img src="shell-shots/3-deep.png"></div>
    <div class="meta"><span class="name">墨绿商务</span><span class="kind">墨绿 #1E3A33</span></div>
    <p class="desc">米白底、衬线字标、墨绿主按钮，与纸面的深色头图呼应。</p></div>
</div>
</body></html>
