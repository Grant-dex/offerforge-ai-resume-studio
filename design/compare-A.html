<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>方案 A</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#EEEDEA;font-family:"PingFang SC","Helvetica Neue",Arial,sans-serif;color:#1A1A1A;padding:24px 28px 28px}
header{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
h1{font-size:19px}h1 b{color:#A8452B}
header p{font-size:11.5px;color:#8A8A86}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{background:#fff;border:1px solid #E0DFDB;padding:7px 7px 9px}
.shot{border:1px solid #ECEBE8;overflow:hidden}
.shot img{display:block;width:100%}
.meta{display:flex;align-items:baseline;justify-content:space-between;padding-top:7px}
.name{font-size:12px;font-weight:700}.kind{font-size:10px;color:#8A8A86}
.desc{margin-top:3px;font-size:10px;line-height:1.5;color:#5F5F5C}
</style></head><body>
<header><h1>方案 A · 外壳跟随模板</h1><p>底色、字标、强调色都随模板切换</p></header>
<div class="grid">
 <div class="card"><div class="shot"><img src="shell-shots/1-editorial.png"></div><div class="meta"><span class="name">暖纸衬线</span><span class="kind">陶土红 #A8452B</span></div><p class="desc">暖米底 + 宋体字标，外壳与纸面同一色温。</p></div>
 <div class="card"><div class="shot"><img src="shell-shots/2-swiss.png"></div><div class="meta"><span class="name">冷灰网格</span><span class="kind">靛蓝 #1F4FD8</span></div><p class="desc">冷白底 + 无衬线字标，外壳跟着纸面一起“冷”。</p></div>
 <div class="card"><div class="shot"><img src="shell-shots/3-deep.png"></div><div class="meta"><span class="name">墨绿商务</span><span class="kind">墨绿 #1E3A33</span></div><p class="desc">米白底 + 宋体字标，呼应深色头图。</p></div>
</div></body></html>
