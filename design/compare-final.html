<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>方案 C 实装</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#EEEDEA;font-family:"PingFang SC","Helvetica Neue",Arial,sans-serif;color:#1A1A1A;padding:22px 26px 26px}

 <div class="card"><div class="shot"><img src="shell-shots/impl/2-swiss.png"></div><div class="meta"><span class="name">冷灰网格</span><span class="kind">靛蓝</span></div></div>
 <div class="card"><div class="shot"><img src="shell-shots/impl/3-deep.png"></div><div class="meta"><span class="name">墨绿商务</span><span class="kind">墨绿</span></div></div>
