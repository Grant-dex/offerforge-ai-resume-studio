<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>A 与 C 的差别</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#EEEDEA;font-family:"PingFang SC","Helvetica Neue",Arial,sans-serif;color:#1A1A1A;padding:24px 28px 28px}
header{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
h1{font-size:19px}header p{font-size:11.5px;color:#8A8A86}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.card{background:#fff;border:1px solid #E0DFDB;padding:9px 9px 11px}
.shot{border:1px solid #ECEBE8;overflow:hidden}
.shot img{display:block;width:100%}
.meta{display:flex;align-items:baseline;justify-content:space-between;padding-top:9px}
.badge{font-size:10px;font-weight:700;letter-spacing:.12em;padding:2px 7px;color:#fff}
.a .badge{background:#A8452B}.c .badge{background:#1E3A33}
.name{font-size:12.5px;font-weight:700}.kind{font-size:10.5px;color:#8A8A86}
.desc{margin-top:4px;font-size:10.5px;line-height:1.55;color:#5F5F5C}
</style></head><body>
<header><h1>同一套模板，A 与 C 的差别</h1><p>以“冷灰网格”为例，差异最明显</p></header>
<div class="grid">
 <div class="card a"><div class="shot"><img src="shell-shots/crop-2-swiss.png"></div><div class="meta"><span class="badge">A</span><span class="name">外壳跟随模板</span><span class="kind">冷白底 · 无衬线字标</span></div><p class="desc">外壳和纸面一起变成冷调，切换模板像换了一个产品。</p></div>
 <div class="card c"><div class="shot"><img src="shell-shots/c/crop-2-swiss.png"></div><div class="meta"><span class="badge">C</span><span class="name">外壳统一暖纸</span><span class="kind">暖米底 · 宋体字标</span></div><p class="desc">外壳恒定，只把强调色换成靛蓝，产品感统一。</p></div>
</div></body></html>
